<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Banker's Safety Algorithm</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 20px;
    background: #fff0f3; /* Light pink background */
    color: #4c1130; /* Dark pink-gray text */
}

.container {
    max-width: 900px;
    margin: auto;
    background: #ffffff; /* White card layout container box */
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
}

h1 {
    text-align: center;
    border-bottom: 3px solid #ff85a2; /* Soft hot pink accent line */
    padding-bottom: 10px;
    color: #ff5c8a; /* Vibrant light pink header text */
}

h3 {
    color: #ff758f;
    margin-top: 25px;
}

.upload-section {
    background: #ffe3e8; /* Soft pink background frame */
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px dashed #ff85a2;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
    background: #fffbfe;
}

th {
    background: #ffccd5; /* Medium light pink table header */
    color: #a31d44;
    font-weight: 600;
}

th, td {
    border: 1px solid #ffccd5;
    padding: 10px;
    text-align: center;
}

input {
    width: 60px;
    text-align: center;
    background: #ffffff;
    border: 1px solid #ffb3c1;
    color: #4c1130;
    padding: 4px;
    border-radius: 4px;
}

input:focus {
    outline: none;
    border-color: #ff5c8a;
}

button {
    width: 100%;
    padding: 12px;
    background: #ff5c8a; /* Bright pink clickable CTA button */
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
    font-weight: 600;
    transition: background 0.2s;
}

button:hover {
    background: #ff477e;
}

.safe {
    background: #e8f5e9; /* Pastel green confirmation bar */
    border: 1px solid #81c784;
    color: #2e7d32;
    padding: 12px;
    margin-top: 15px;
    border-radius: 6px;
    font-weight: bold;
}

.unsafe {
    background: #ffebee; /* Pastel red alert box */
    border: 1px solid #e57373;
    color: #c62828;
    padding: 12px;
    margin-top: 15px;
    border-radius: 6px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h1>Banker's Safety Algorithm</h1>

<div class="upload-section">
    <strong>📁 Populate Form via CSV:</strong> 
    <input type="file" id="csvFile" accept=".csv" style="width: auto; background: transparent; border: none; color: inherit;">
    <small style="display: block; margin-top: 5px; color: #ff758f;">Format: Row 1 is Available (A,B,C). Rows 2-6 are P0-P4 formatted as: AllocA,AllocB,AllocC,MaxA,MaxB,MaxC</small>
</div>

<h3>Available Resources</h3>
A <input type="number" id="avail-A" value="3">
B <input type="number" id="avail-B" value="3">
C <input type="number" id="avail-C" value="2">

<h3>Process Table</h3>

<div class="table-wrapper">
<table>
<tr>
<th>Process</th>
<th colspan="3">Allocation</th>
<th colspan="3">Max</th>
</tr>

<tr>
<th></th><th>A</th><th>B</th><th>C</th>
<th>A</th><th>B</th><th>C</th>
</tr>

<tbody id="body">

<tr>
<td>P0</td>
<td><input class="a0" value="0"></td><td><input class="a0" value="1"></td><td><input class="a0" value="0"></td>
<td><input class="m0" value="7"></td><td><input class="m0" value="5"></td><td><input class="m0" value="3"></td>
</tr>

<tr>
<td>P1</td>
<td><input class="a1" value="2"></td><td><input class="a1" value="0"></td><td><input class="a1" value="0"></td>
<td><input class="m1" value="3"></td><td><input class="m1" value="2"></td><td><input class="m1" value="2"></td>
</tr>

<tr>
<td>P2</td>
<td><input class="a2" value="3"></td><td><input class="a2" value="0"></td><td><input class="a2" value="2"></td>
<td><input class="m2" value="9"></td><td><input class="m2" value="0"></td><td><input class="m2" value="2"></td>
</tr>

<tr>
<td>P3</td>
<td><input class="a3" value="2"></td><td><input class="a3" value="1"></td><td><input class="a3" value="1"></td>
<td><input class="m3" value="2"></td><td><input class="m3" value="2"></td><td><input class="m3" value="2"></td>
</tr>

<tr>
<td>P4</td>
<td><input class="a4" value="0"></td><td><input class="a4" value="0"></td><td><input class="a4" value="2"></td>
<td><input class="m4" value="4"></td><td><input class="m4" value="3"></td><td><input class="m4" value="3"></td>
</tr>

</tbody>
</table>
</div>

<button onclick="run()">Check Safety</button>

<div id="need"></div>
<div id="result"></div>

</div>

<script>
document.getElementById('csvFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        
        if(lines.length < 6) {
            alert("Error: File needs at least 1 row for Available and 5 rows for processes.");
            return;
        }

        const availData = lines[0].split(',');
        document.getElementById("avail-A").value = availData[0] || 0;
        document.getElementById("avail-B").value = availData[1] || 0;
        document.getElementById("avail-C").value = availData[2] || 0;

        for (let i = 0; i < 5; i++) {
            const rowData = lines[i + 1].split(',');
            if (rowData.length >= 6) {
                const allocInputs = document.querySelectorAll(".a" + i);
                const maxInputs = document.querySelectorAll(".m" + i);
                
                allocInputs[0].value = rowData[0] || 0;
                allocInputs[1].value = rowData[1] || 0;
                allocInputs[2].value = rowData[2] || 0;
                
                maxInputs[0].value = rowData[3] || 0;
                maxInputs[1].value = rowData[4] || 0;
                maxInputs[2].value = rowData[5] || 0;
            }
        }
    };
    reader.readAsText(file);
});

function run() {

const n = 5, r = 3;

let available = [
parseInt(document.getElementById("avail-A").value),
parseInt(document.getElementById("avail-B").value),
parseInt(document.getElementById("avail-C").value)
];

let alloc = [], max = [], need = [];

// build matrices
for (let i = 0; i < n; i++) {

let a = [], m = [];

for (let j = 0; j < r; j++) {
let av = parseInt(document.querySelectorAll(".a"+i)[j].value);
let mx = parseInt(document.querySelectorAll(".m"+i)[j].value);

// validation (IMPORTANT FIX)
if (av > mx) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>Error: Allocation cannot exceed Max</div>";
return;
}

if (av < 0 || mx < 0) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>Error: Negative values not allowed</div>";
return;
}

a.push(av);
m.push(mx);
}

alloc.push(a);
max.push(m);
}

// need calculation
for (let i = 0; i < n; i++) {
let row = [];
for (let j = 0; j < r; j++) {
row.push(max[i][j] - alloc[i][j]);
}
need.push(row);
}

// show need matrix
let html = "<h3>Need Matrix</h3><table><tr><th>P</th><th>A</th><th>B</th><th>C</th></tr>";

for (let i = 0; i < n; i++) {
html += `<tr><td>P${i}</td><td>${need[i][0]}</td><td>${need[i][1]}</td><td>${need[i][2]}</td></tr>`;
}
html += "</table>";

document.getElementById("need").innerHTML = html;

// banker algorithm
let finish = Array(n).fill(false);
let work = [...available];
let seq = [];

let count = 0;

while (count < n) {
let found = false;

for (let i = 0; i < n; i++) {

if (!finish[i]) {

let ok = true;

for (let j = 0; j < r; j++) {
if (need[i][j] > work[j]) {
ok = false;
break;
}
}

if (ok) {
for (let j = 0; j < r; j++) {
work[j] += alloc[i][j];
}
seq.push("P" + i);
finish[i] = true;
found = true;
count++;
}
}
}

if (!found) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>⚠ Unsafe State (may lead to deadlock)</div>";
return;
}
}

document.getElementById("result").innerHTML =
"<div class='safe'>Safe Sequence: " + seq.join(" → ") + "</div>";

}
</script>

</body>
</html>
