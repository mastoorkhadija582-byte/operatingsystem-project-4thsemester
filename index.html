<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Banker's Safety Algorithm</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    border-bottom: 3px solid #3b82f6;
    padding-bottom: 10px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

input {
    width: 60px;
    text-align: center;
}

button {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
}

.safe {
    background: #dcfce7;
    padding: 10px;
    margin-top: 10px;
}

.unsafe {
    background: #fee2e2;
    padding: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Banker's Safety Algorithm</h1>

<h3>Available Resources</h3>
A <input type="number" id="avail-A" value="3">
B <input type="number" id="avail-B" value="3">
C <input type="number" id="avail-C" value="2">

<h3>Process Table</h3>

<div class="table-wrapper">
<table>
<tr>
<th>Process</th>
<th colspan="3">Allocation</th>
<th colspan="3">Max</th>
</tr>

<tr>
<th></th><th>A</th><th>B</th><th>C</th>
<th>A</th><th>B</th><th>C</th>
</tr>

<tbody id="body">

<tr>
<td>P0</td>
<td><input class="a0" value="0"></td><td><input class="a0" value="1"></td><td><input class="a0" value="0"></td>
<td><input class="m0" value="7"></td><td><input class="m0" value="5"></td><td><input class="m0" value="3"></td>
</tr>

<tr>
<td>P1</td>
<td><input class="a1" value="2"></td><td><input class="a1" value="0"></td><td><input class="a1" value="0"></td>
<td><input class="m1" value="3"></td><td><input class="m1" value="2"></td><td><input class="m1" value="2"></td>
</tr>

<tr>
<td>P2</td>
<td><input class="a2" value="3"></td><td><input class="a2" value="0"></td><td><input class="a2" value="2"></td>
<td><input class="m2" value="9"></td><td><input class="m2" value="0"></td><td><input class="m2" value="2"></td>
</tr>

<tr>
<td>P3</td>
<td><input class="a3" value="2"></td><td><input class="a3" value="1"></td><td><input class="a3" value="1"></td>
<td><input class="m3" value="2"></td><td><input class="m3" value="2"></td><td><input class="m3" value="2"></td>
</tr>

<tr>
<td>P4</td>
<td><input class="a4" value="0"></td><td><input class="a4" value="0"></td><td><input class="a4" value="2"></td>
<td><input class="m4" value="4"></td><td><input class="m4" value="3"></td><td><input class="m4" value="3"></td>
</tr>

</tbody>
</table>
</div>

<button onclick="run()">Check Safety</button>

<div id="need"></div>
<div id="result"></div>

</div>

<script>
function run() {

const n = 5, r = 3;

let available = [
parseInt(document.getElementById("avail-A").value),
parseInt(document.getElementById("avail-B").value),
parseInt(document.getElementById("avail-C").value)
];

let alloc = [], max = [], need = [];

// build matrices
for (let i = 0; i < n; i++) {

let a = [], m = [];

for (let j = 0; j < r; j++) {
let av = parseInt(document.querySelectorAll(".a"+i)[j].value);
let mx = parseInt(document.querySelectorAll(".m"+i)[j].value);

// validation (IMPORTANT FIX)
if (av > mx) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>Error: Allocation cannot exceed Max</div>";
return;
}

if (av < 0 || mx < 0) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>Error: Negative values not allowed</div>";
return;
}

a.push(av);
m.push(mx);
}

alloc.push(a);
max.push(m);
}

// need calculation
for (let i = 0; i < n; i++) {
let row = [];
for (let j = 0; j < r; j++) {
row.push(max[i][j] - alloc[i][j]);
}
need.push(row);
}

// show need matrix
let html = "<h3>Need Matrix</h3><table><tr><th>P</th><th>A</th><th>B</th><th>C</th></tr>";

for (let i = 0; i < n; i++) {
html += `<tr><td>P${i}</td><td>${need[i][0]}</td><td>${need[i][1]}</td><td>${need[i][2]}</td></tr>`;
}
html += "</table>";

document.getElementById("need").innerHTML = html;

// banker algorithm
let finish = Array(n).fill(false);
let work = [...available];
let seq = [];

let count = 0;

while (count < n) {
let found = false;

for (let i = 0; i < n; i++) {

if (!finish[i]) {

let ok = true;

for (let j = 0; j < r; j++) {
if (need[i][j] > work[j]) {
ok = false;
break;
}
}

if (ok) {
for (let j = 0; j < r; j++) {
work[j] += alloc[i][j];
}
seq.push("P" + i);
finish[i] = true;
found = true;
count++;
}
}
}

if (!found) {
document.getElementById("result").innerHTML =
"<div class='unsafe'>⚠ Unsafe State (may lead to deadlock)</div>";
return;
}
}

document.getElementById("result").innerHTML =
"<div class='safe'>Safe Sequence: " + seq.join(" → ") + "</div>";

}
</script>

</body>
</html>
