<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Banker's Algorithm with Excel Import</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f1f5f9;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

td, th {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

input {
    width: 60px;
    text-align: center;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

.safe { background: #dcfce7; padding: 10px; }
.unsafe { background: #fee2e2; padding: 10px; }
</style>
</head>

<body>

<div class="container">

<h2>Banker's Algorithm (Excel Enabled)</h2>

<h3>Upload Excel File</h3>
<input type="file" id="fileInput" accept=".xlsx,.csv" />

<h3>Available Resources</h3>
A <input id="a" value="3">
B <input id="b" value="3">
C <input id="c" value="2">

<h3>Process Data</h3>

<table>
<tr>
<th>Process</th><th colspan="3">Allocation</th><th colspan="3">Max</th>
</tr>

<tr>
<th></th><th>A</th><th>B</th><th>C</th>
<th>A</th><th>B</th><th>C</th>
</tr>

<tbody>
<tr>
<td>P0</td>
<td><input class="a0" value="0"><input class="a0" value="1"><input class="a0" value="0"></td>
<td><input class="m0" value="7"><input class="m0" value="5"><input class="m0" value="3"></td>
</tr>

<tr>
<td>P1</td>
<td><input class="a1" value="2"><input class="a1" value="0"><input class="a1" value="0"></td>
<td><input class="m1" value="3"><input class="m1" value="2"><input class="m1" value="2"></td>
</tr>

<tr>
<td>P2</td>
<td><input class="a2" value="3"><input class="a2" value="0"><input class="a2" value="2"></td>
<td><input class="m2" value="9"><input class="m2" value="0"><input class="m2" value="2"></td>
</tr>

<tr>
<td>P3</td>
<td><input class="a3" value="2"><input class="a3" value="1"><input class="a3" value="1"></td>
<td><input class="m3" value="2"><input class="m3" value="2"><input class="m3" value="2"></td>
</tr>

<tr>
<td>P4</td>
<td><input class="a4" value="0"><input class="a4" value="0"><input class="a4" value="2"></td>
<td><input class="m4" value="4"><input class="m4" value="3"><input class="m4" value="3"></td>
</tr>
</tbody>
</table>

<button onclick="run()">Check Safety</button>

<div id="need"></div>
<div id="result"></div>

</div>

<script>
document.getElementById("fileInput").addEventListener("change", handleFile);

function handleFile(e) {
const file = e.target.files[0];
if (!file) return;

const reader = new FileReader();

reader.onload = function(event) {
const data = new Uint8Array(event.target.result);
const workbook = XLSX.read(data, { type: "array" });

const sheet = workbook.Sheets[workbook.SheetNames[0]];
const json = XLSX.utils.sheet_to_json(sheet);

if (json.length === 0) {
alert("Empty Excel file");
return;
}

// Available resources
if (json[0].A_Avail !== undefined) a.value = json[0].A_Avail;
if (json[0].B_Avail !== undefined) b.value = json[0].B_Avail;
if (json[0].C_Avail !== undefined) c.value = json[0].C_Avail;

// Fill matrices
json.forEach((row, i) => {
if (i > 4) return;

let alloc = document.querySelectorAll(".a" + i);
let max = document.querySelectorAll(".m" + i);

if (alloc.length === 3) {
alloc[0].value = row.Alloc_A || 0;
alloc[1].value = row.Alloc_B || 0;
alloc[2].value = row.Alloc_C || 0;
}

if (max.length === 3) {
max[0].value = row.Max_A || 0;
max[1].value = row.Max_B || 0;
max[2].value = row.Max_C || 0;
}
});

run();
};

reader.readAsArrayBuffer(file);
}

function run() {

const n = 5, r = 3;

let available = [
parseInt(a.value),
parseInt(b.value),
parseInt(c.value)
];

let alloc = [], max = [], need = [];

// build matrices
for (let i = 0; i < n; i++) {

let aRow = document.querySelectorAll(".a" + i);
let mRow = document.querySelectorAll(".m" + i);

let aVals = [], mVals = [];

for (let j = 0; j < r; j++) {
let av = parseInt(aRow[j].value);
let mx = parseInt(mRow[j].value);

if (av > mx) {
result.innerHTML = "<div class='unsafe'>Allocation cannot exceed Max</div>";
return;
}

aVals.push(av);
mVals.push(mx);
}

alloc.push(aVals);
max.push(mVals);
}

// need
for (let i = 0; i < n; i++) {
let row = [];
for (let j = 0; j < r; j++) {
row.push(max[i][j] - alloc[i][j]);
}
need.push(row);
}

// show need
let html = "<h3>Need Matrix</h3><table><tr><th>P</th><th>A</th><th>B</th><th>C</th></tr>";

for (let i = 0; i < n; i++) {
html += `<tr><td>P${i}</td><td>${need[i][0]}</td><td>${need[i][1]}</td><td>${need[i][2]}</td></tr>`;
}
html += "</table>";

need.innerHTML = html;

// banker
let finish = Array(n).fill(false);
let work = [...available];
let seq = [];

let count = 0;

while (count < n) {
let found = false;

for (let i = 0; i < n; i++) {

if (!finish[i]) {
let ok = true;

for (let j = 0; j < r; j++) {
if (need[i][j] > work[j]) {
ok = false;
break;
}
}

if (ok) {
for (let j = 0; j < r; j++) {
work[j] += alloc[i][j];
}

seq.push("P" + i);
finish[i] = true;
found = true;
count++;
}
}
}

if (!found) {
result.innerHTML = "<div class='unsafe'>Unsafe State (no safe sequence)</div>";
return;
}
}

result.innerHTML = "<div class='safe'>Safe Sequence: " + seq.join(" → ") + "</div>";
}
</script>

</body>
</html>
